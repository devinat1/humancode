name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24: node-gyp@latest (via tree-sitter-powershell) pulls undici 8,
      # which needs markAsUncloneable (Node >= 22.10). Node 20 fails bun install.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: ./.github/actions/setup-bun

      - name: Build all platforms
        run: bun run build
        working-directory: packages/opencode
        env:
          OPENCODE_BUMP: ${{ inputs.bump || 'patch' }}

      - name: Create release archives
        working-directory: packages/opencode
        run: |
          for dir in dist/humancode-*/; do
            name=$(basename "$dir")
            if [[ "$name" == *linux* ]]; then
              tar -czf "dist/${name}.tar.gz" -C "${dir}bin" .
            else
              (cd "${dir}bin" && zip -r "../../${name}.zip" .)
            fi
          done

      - name: Determine version
        id: version
        working-directory: packages/opencode
        run: |
          VERSION=$(node -e "console.log(require('./dist/humancode-darwin-arm64/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        working-directory: packages/opencode
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; uploading assets with --clobber"
            gh release upload "v$VERSION" dist/*.zip dist/*.tar.gz --clobber
          else
            gh release create "v$VERSION" dist/*.zip dist/*.tar.gz \
              --title "v$VERSION" --generate-notes
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}

      - name: Setup Homebrew tap SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HOMEBREW_TAP_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

      - name: Publish npm + update Homebrew tap
        working-directory: packages/opencode
        run: ./script/publish.ts
        env:
          OPENCODE_BUMP: ${{ inputs.bump || 'patch' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
